# Render Blueprint — https://render.com/docs/blueprint-spec
# After first sync: set GEMINI_API_KEY, then set CORS_ORIGINS + VITE_API_BASE_URL
# to the live https://*.onrender.com origins (static site URL for CORS; API URL for Vite).
services:
  - type: web
    name: data-extracting-api
    runtime: python
    plan: free
    # Root must contain uv.lock so Render enables uv (https://render.com/docs/uv-version).
    rootDir: backend
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn data_extracting_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      # Submission/demo: do not seed Buffy Order on the public instance.
      - key: SEED_DEMO_DATA
        value: "false"
      # Per-instance in-memory /extract limit (not shared across multiple instances).
      - key: EXTRACT_RATE_LIMIT_ENABLED
        value: "true"
      - key: EXTRACT_RATE_LIMIT_PER_MINUTE
        value: "15"
      # Dashboard-only secrets / cross-service URLs (do not commit real values).
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Shared demo key for writes + /extract. Set to demo-reviewer-key (match README).
      - key: API_KEY
        sync: false

  - type: web
    name: data-extracting-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA fallback so client routes still serve index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Must be the public API origin (https://…onrender.com), available at Vite build time.
      - key: VITE_API_BASE_URL
        sync: false
